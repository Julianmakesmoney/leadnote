<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragnet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c0e'/%3E%3Cpath d='M7 9h18M9 15h14M11 21h10' stroke='%233ddc97' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h22M8 15h16M11 22h10" /></svg>
      <span>Dragnet</span>
    </div>
    <div class="niche" id="niche"></div>
    <div class="live" id="live" title="Refreshes every 10 seconds"><i></i><span>live</span></div>
  </header>

  <main>
    <section class="funnel" id="funnel" aria-label="Funnel"></section>

    <section class="controls" aria-label="Filters">
      <input id="q" type="search" placeholder="Search name, category, reason" autocomplete="off">
      <div class="seg" id="fit" role="group" aria-label="Fit">
        <button data-v="fitting" class="on">Fit</button>
        <button data-v="yes">Yes</button>
        <button data-v="partly">Partly</button>
        <button data-v="no">No</button>
        <button data-v="unlabeled">Not checked</button>
        <button data-v="all">All</button>
      </div>
      <select id="area" aria-label="Area"><option value="">All areas</option></select>
      <select id="size" aria-label="Size">
        <option value="">Any size</option>
        <option value="1-9">1–9</option>
        <option value="10-49">10–49</option>
        <option value="50-249">50–249</option>
        <option value="250+">250+</option>
        <option value="unknown">Unknown</option>
      </select>
      <label class="check"><input type="checkbox" id="jobs"> Hiring</label>
      <button class="primary" id="export">Export CSV</button>
    </section>

    <section class="tablewrap">
      <table>
        <thead>
          <tr>
            <th data-k="fit">Fit</th>
            <th data-k="name">Company</th>
            <th data-k="category" class="hide-s">Category</th>
            <th data-k="area" class="hide-m">Area</th>
            <th data-k="size">Size</th>
            <th data-k="reviews" class="hide-s">Reviews</th>
            <th data-k="jobs" class="hide-m">Jobs</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>

  <aside class="card" id="card" aria-hidden="true">
    <button class="close" id="close" aria-label="Close">×</button>
    <div id="cardbody"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <script src="app.js"></script>
</body>
</html>
